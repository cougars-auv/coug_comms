base_status_extractor_node:
  agent_list:
    type: string_array
    default_value: []
  status_topic:
    type: string
    default_value: "base/agent/status"
    validation:
      not_empty<>: []
  odom_topic:
    type: string
    default_value: "base/odometry/global"
    validation:
      not_empty<>: []
  depth_topic:
    type: string
    default_value: "base/seatrac/depth/odometry"
    validation:
      not_empty<>: []
  imu_topic:
    type: string
    default_value: "base/seatrac/imu/data"
    validation:
      not_empty<>: []
  map_frame:
    type: string
    default_value: "map"
    validation:
      not_empty<>: []
  multiagent_base_frame:
    type: string
    default_value: "base_link"
    validation:
      not_empty<>: []
