auv_status_bundler_node:
  # --- ROS Topics and Frames ---
  status_topic:
    type: string
    default_value: "agent/status"
    validation:
      not_empty<>: []
  odom_topic:
    type: string
    default_value: "odometry/global"
    validation:
      not_empty<>: []
  depth_topic:
    type: string
    default_value: "depth/odometry"
    validation:
      not_empty<>: []
  imu_topic:
    type: string
    default_value: "imu/data"
    validation:
      not_empty<>: []

  base_frame:
    type: string
    default_value: "base_link"
    validation:
      not_empty<>: []
